<!DOCTYPE html>
<html>
  <head>
    <title>Tech Club Local AR Viewer</title>
    <!-- Load A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Make the upload button float on top of the camera view -->
    <style>
      #upload-ui {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(255, 255, 255, 0.9);
        padding: 15px 20px;
        border-radius: 10px;
        font-family: sans-serif;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      input[type="file"] {
        margin-top: 10px;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- The File Upload Interface -->
    <div id="upload-ui">
      <b>Upload your Tinkercad .GLB design:</b><br>
      <!-- Accept only .glb files to prevent errors -->
      <input type="file" id="file-input" accept=".glb">
    </div>

    <!-- The AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <!-- We leave gltf-model empty at first. JavaScript will fill it! -->
        <a-entity id="dynamic-model" scale="0.05 0.05 0.05" position="0 0 0"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <!-- The JavaScript to handle the upload -->
    <script>
      const fileInput = document.getElementById('file-input');
      const modelEntity = document.getElementById('dynamic-model');

      fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        
        if (file) {
          // Create a temporary local web address for the uploaded file
          const objectUrl = URL.createObjectURL(file);
          
          // Tell the AR scene to load this new local address
          modelEntity.setAttribute('gltf-model', objectUrl);
        }
      });
    </script>

  </body>
</html>
